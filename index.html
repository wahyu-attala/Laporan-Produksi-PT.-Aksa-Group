<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Papan Produksi PT Aksa Group</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--bg:#eef2f3;--card:#fff;--ink:#17232a;--muted:#657680;--line:#d4dde1;--brand:#1d5c7a;--soft:#dceaf1;--warn:#ca791a;--ok:#2e7d4f;--bad:#b3402f;--navy:#18272e}*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}.wrap{max-width:1500px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:12px}.logo{width:46px;height:46px;border-radius:10px;background:var(--brand);color:white;display:grid;place-items:center;font-weight:800;font-size:20px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--brand);font-weight:800}h1{margin:1px 0;font-size:32px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #aab8bf;background:white;padding:9px 13px;border-radius:7px;font-weight:700}.btn.primary{background:var(--brand);border-color:var(--brand);color:white}.btn.bad{color:var(--bad);border-color:#dcaca3}.btn:disabled{opacity:.5;cursor:not-allowed}.setup{margin-top:12px;background:#fff8dd;border:1px solid #dfc975;border-radius:8px;padding:11px 14px}.summary{display:grid;grid-template-columns:repeat(13,minmax(92px,1fr));gap:7px;margin:14px 0}.tile{border:1px solid var(--line);background:var(--card);border-radius:7px;padding:8px;text-align:left}.tile.active{border:2px solid var(--brand);background:var(--soft)}.tile b{display:block;font-size:26px}.tile span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:800}.tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0}.tools input[type=search]{flex:1 1 260px;max-width:430px;padding:9px 12px;border:1px solid #aab8bf;border-radius:7px}.board{overflow:auto;background:white;border:1px solid var(--line);border-radius:8px}table{border-collapse:separate;border-spacing:0;min-width:1450px;width:100%}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left}thead th{background:#f3f6f7;color:var(--muted);font-size:12px;text-transform:uppercase}tbody tr:last-child td{border-bottom:0}.sticky{position:sticky;left:0;background:white;z-index:2;min-width:210px;border-right:1px solid var(--line)}thead .sticky{z-index:3;background:#f3f6f7}.wo{font-family:ui-monospace,monospace;color:var(--muted);font-size:12px}.client{font-weight:800}.cell{width:43px;height:32px;border:1.5px solid #abb8bf;border-radius:6px;background:white}.cell[data-state=proses]{background:var(--warn);border-color:var(--warn);color:white}.cell[data-state=selesai]{background:var(--ok);border-color:var(--ok);color:white}.cell[data-state=skip]{background:repeating-linear-gradient(135deg,#fff 0 4px,#dfe5e8 4px 5px);color:var(--muted)}.modal-backdrop{position:fixed;inset:0;background:#0d171bb8;display:grid;place-items:center;padding:16px;z-index:20}.modal-backdrop[hidden]{display:none}.modal{width:min(520px,100%);background:white;border-radius:10px;padding:18px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form-grid label{display:flex;flex-direction:column;gap:4px;color:var(--muted);font-weight:700;font-size:12px}.form-grid input{width:100%;padding:9px;border:1px solid #aab8bf;border-radius:6px}.wide{grid-column:1/-1}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.toast{position:fixed;right:16px;bottom:16px;background:var(--navy);color:white;border-radius:8px;padding:11px 14px;max-width:min(420px,calc(100vw - 32px));z-index:30}.toast[hidden]{display:none}.empty{text-align:center;padding:42px 16px;color:var(--muted)}@media(max-width:700px){.wrap{padding:10px}.summary{grid-template-columns:repeat(4,minmax(80px,1fr))}.form-grid{grid-template-columns:1fr}.wide{grid-column:auto}.top h1{font-size:26px}}
  </style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><div class="logo">A</div><div><div class="eyebrow">Sheet Metal Fabrication</div><h1>Papan Produksi</h1></div></div>
    <div class="actions">
      <span id="status" class="btn">Memuat</span>
      <button id="loginBtn" class="btn" type="button">Masuk editor</button>
      <button id="logoutBtn" class="btn" type="button" hidden>Keluar</button>
      <button id="setupBtn" class="btn" type="button">Pengaturan</button>
      <button id="addBtn" class="btn primary" type="button" disabled>+ Tambah order</button>
    </div>
  </header>
  <div id="setupNotice" class="setup" hidden>Papan belum tersambung ke database bersama. Tekan <b>Pengaturan</b>, lalu masukkan URL dan anon key Supabase.</div>
  <section id="summary" class="summary"></section>
  <div class="tools"><input id="search" type="search" placeholder="Cari client, WO, jenis atau type barang"><label><input id="hideDone" type="checkbox"> Sembunyikan yang terkirim</label></div>
  <div class="board"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
</div>

<div id="orderModal" class="modal-backdrop" hidden><div class="modal"><h2>Tambah order</h2><form id="orderForm" class="form-grid"><label>Client<input name="client" required maxlength="80"></label><label>Nomor WO<input name="wo" required maxlength="40"></label><label>Jenis barang<input name="item" required maxlength="80"></label><label>Type barang<input name="type" required maxlength="80"></label><label>Jumlah unit<input name="qty" type="number" min="1" required></label><label>Lokasi / catatan<input name="position" maxlength="120" placeholder="Opsional"></label><div class="wide modal-actions"><button class="btn" type="button" data-close="orderModal">Batal</button><button class="btn primary" type="submit">Simpan</button></div></form></div></div>
<div id="loginModal" class="modal-backdrop" hidden><div class="modal"><h2>Masuk sebagai editor</h2><form id="loginForm" class="form-grid"><label class="wide">Email editor<input name="email" type="email" required></label><div class="wide modal-actions"><button class="btn" type="button" data-close="loginModal">Batal</button><button class="btn primary" type="submit">Kirim tautan masuk</button></div></form></div></div>
<div id="setupModal" class="modal-backdrop" hidden><div class="modal"><h2>Pengaturan Supabase</h2><form id="setupForm" class="form-grid"><label class="wide">Project URL<input name="url" required placeholder="https://PROJECT.supabase.co"></label><label class="wide">Anon / Publishable key<input name="key" required></label><div class="wide modal-actions"><button class="btn" type="button" data-close="setupModal">Batal</button><button class="btn primary" type="submit">Sambungkan</button></div></form></div></div>
<div id="toast" class="toast" hidden></div>
<script>
(()=>{const STAGES=[['eng','Engineering'],['nest','Nesting'],['laser','Laser'],['bend','Bending'],['punch','Punching'],['weld','Welding'],['fin','Finishing'],['treat','Treatment'],['coat','Coating'],['asm','Assembling'],['fg','Finish Goods'],['del','Delivery']],NEXT={belum:'proses',proses:'selesai',selesai:'skip',skip:'belum'},SYMBOL={belum:'○',proses:'◐',selesai:'✓',skip:'—'};let supabase=null,session=null,canEdit=false,orders=[],filter=null,search='',hideDone=false;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]);function toast(m){const e=$('toast');e.textContent=m;e.hidden=false;clearTimeout(e._timer);e._timer=setTimeout(()=>e.hidden=true,5000)}function position(o){let open=null,working=null;for(const[k,n]of STAGES){const v=o.stages?.[k]||'belum';if(v==='proses')working=[k,n];if(!open&&v==='belum')open=[k,n]}if(working)return{key:working[0],name:working[1]};if(open)return{key:open[0],name:open[1]};return{key:'done',name:'Terkirim'}}function render(){const c={done:0};STAGES.forEach(s=>c[s[0]]=0);orders.forEach(o=>c[position(o).key]=(c[position(o).key]||0)+1);let sh='';STAGES.forEach(([k,n])=>sh+=`<button class="tile ${filter===k?'active':''}" data-filter="${k}"><span>${esc(n)}</span><b>${c[k]}</b></button>`);sh+=`<button class="tile ${filter==='done'?'active':''}" data-filter="done"><span>Terkirim</span><b>${c.done}</b></button>`;$('summary').innerHTML=sh;let hh='<tr><th class="sticky">Client / WO</th><th>Jenis &amp; Type</th><th>Unit</th><th>Posisi</th>';STAGES.forEach(([,n])=>hh+=`<th>${esc(n)}</th>`);hh+='<th></th></tr>';$('thead').innerHTML=hh;const q=search.toLowerCase().trim(),visible=orders.filter(o=>{const p=position(o);if(hideDone&&p.key==='done')return false;if(filter&&p.key!==filter)return false;return!q||[o.client,o.wo,o.item,o.type].join(' ').toLowerCase().includes(q)}).sort((a,b)=>String(a.wo).localeCompare(String(b.wo),'id',{numeric:true}));if(!visible.length){$('tbody').innerHTML='<tr><td colspan="17"><div class="empty">Tidak ada order yang cocok</div></td></tr>';return}let html='';visible.forEach(o=>{const p=position(o);html+=`<tr><td class="sticky"><div class="client">${esc(o.client)}</div><div class="wo">${esc(o.wo)}</div></td><td><b>${esc(o.item)}</b><div>${esc(o.type)}</div></td><td>${esc(o.qty)}</td><td>${esc(p.name)}</td>`;STAGES.forEach(([k,n])=>{const v=o.stages?.[k]||'belum';html+=`<td><button class="cell" data-id="${esc(o.id)}" data-stage="${k}" data-state="${v}" title="${esc(n)}: ${v}" ${canEdit?'':'disabled'}>${SYMBOL[v]}</button></td>`});html+=`<td>${canEdit?`<button class="btn bad" data-delete="${esc(o.id)}">Hapus</button>`:''}</td></tr>`});$('tbody').innerHTML=html}async function refresh(){if(!supabase)return;try{const{data,error}=await supabase.from('orders').select('*').order('created_at',{ascending:false});if(error)throw error;orders=data||[];$('status').textContent='Tersambung';render()}catch(e){$('status').textContent='Gagal memuat';toast(e.message)}}async function checkPermissions(){canEdit=false;if(!supabase||!session){updateAuth();return}const email=session.user.email,{data,error}=await supabase.from('editors').select('email').eq('email',email).maybeSingle();canEdit=!error&&!!data;updateAuth();render()}function updateAuth(){$('loginBtn').hidden=!!session;$('logoutBtn').hidden=!session;$('addBtn').disabled=!canEdit;$('status').title=session?(canEdit?'Editor aktif':'Akun ini tidak punya izin editor'):'Pengunjung publik'}async function initSupabase(){const url=localStorage.getItem('aksa_supabase_url'),key=localStorage.getItem('aksa_supabase_key');if(!url||!key){$('setupNotice').hidden=false;$('status').textContent='Belum tersambung';return}$('setupNotice').hidden=true;supabase=window.supabase.createClient(url,key);supabase.auth.onAuthStateChange(async(_e,s)=>{session=s;await checkPermissions()});const{data}=await supabase.auth.getSession();session=data.session;await checkPermissions();await refresh();supabase.channel('orders-live').on('postgres_changes',{event:'*',schema:'public',table:'orders'},refresh).subscribe()}
$('summary').addEventListener('click',e=>{const b=e.target.closest('[data-filter]');if(!b)return;filter=filter===b.dataset.filter?null:b.dataset.filter;render()});$('search').addEventListener('input',e=>{search=e.target.value;render()});$('hideDone').addEventListener('change',e=>{hideDone=e.target.checked;render()});$('tbody').addEventListener('click',async e=>{const c=e.target.closest('[data-stage]');if(c&&canEdit){const o=orders.find(x=>x.id===c.dataset.id);if(!o)return;const stages={...(o.stages||{})};stages[c.dataset.stage]=NEXT[c.dataset.state];const{error}=await supabase.from('orders').update({stages,updated_at:new Date().toISOString()}).eq('id',o.id);if(error)toast(error.message);else toast('Status produksi diperbarui')}const d=e.target.closest('[data-delete]');if(d&&canEdit&&confirm('Hapus order '+d.dataset.delete+'?')){const{error}=await supabase.from('orders').delete().eq('id',d.dataset.delete);if(error)toast(error.message)}});$('addBtn').onclick=()=>$('orderModal').hidden=false;$('loginBtn').onclick=()=>$('loginModal').hidden=false;$('setupBtn').onclick=()=>{ $('setupForm').url.value=localStorage.getItem('aksa_supabase_url')||'';$('setupForm').key.value=localStorage.getItem('aksa_supabase_key')||'';$('setupModal').hidden=false};document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$(b.dataset.close).hidden=true);$('setupForm').onsubmit=e=>{e.preventDefault();localStorage.setItem('aksa_supabase_url',$('setupForm').url.value.trim());localStorage.setItem('aksa_supabase_key',$('setupForm').key.value.trim());$('setupModal').hidden=true;location.reload()};$('loginForm').onsubmit=async e=>{e.preventDefault();const{error}=await supabase.auth.signInWithOtp({email:$('loginForm').email.value.trim(),options:{emailRedirectTo:location.origin+location.pathname}});if(error)toast(error.message);else{$('loginModal').hidden=true;toast('Tautan masuk telah dikirim ke email')}};$('logoutBtn').onclick=async()=>{if(supabase)await supabase.auth.signOut()};$('orderForm').onsubmit=async e=>{e.preventDefault();if(!canEdit)return;const f=new FormData(e.target),stages={};STAGES.forEach(([k])=>stages[k]='belum');const row={client:f.get('client').trim(),wo:f.get('wo').trim(),item:f.get('item').trim(),type:f.get('type').trim(),qty:Number(f.get('qty')),position:f.get('position').trim(),stages};const{error}=await supabase.from('orders').insert(row);if(error)toast(error.message);else{$('orderModal').hidden=true;e.target.reset();toast('Order berhasil ditambahkan')}};initSupabase()})();
</script>
</body>
</html>
